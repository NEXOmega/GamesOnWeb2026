<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Six</title>
    <style>
        html,body {
            overflow: hidden;
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
        }
        #renderCanvas {
            width: 100%;
            height: 100%;
            touch-action: none;
        }
        #fadeOverlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: black;
            opacity: 0; /* Transparent par défaut */
            pointer-events: none; /* Laisse passer les clics vers le jeu */
            transition: opacity 0.5s ease-in-out; /* La magie de l'animation fluide */
            z-index: 9999; /* Toujours au premier plan */
        }
    </style>
</head>
<body>
    <canvas id="renderCanvas" touch-action="none"></canvas>
    <div id="fadeOverlay"></div>
    <script src="dist/app.js"></script>
</body>
</html>
